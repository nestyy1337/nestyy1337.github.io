{% component site_header() %}
<header class="index-header">
  <a class="index-signature" href="{{ get_url(path='@/_index.md') }}" aria-label="Szymon Głuch, also nesty, home">Szymon Głuch <span class="index-alias">/ nesty</span></a>
  <nav aria-label="Main navigation">
    <a href="{{ get_url(path='@/software/_index.md') }}">Software</a>
    <a href="{{ get_url(path='@/writing/_index.md') }}">Writing</a>
  </nav>
  <div class="index-tools">
    <a class="index-feed" href="{{ get_url(path='atom.xml') }}" aria-label="Subscribe to the Atom feed">Feed</a>

      <svg class="theme-moon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M20.5 14A8.5 8.5 0 0 1 10 3.5 8.5 8.5 0 1 0 20.5 14Z"/></svg>
      <span data-theme-label>Light</span>
    </button>
  </div>
</header>
{% endcomponent site_header %}
